<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog admin belépés - Nádasdi Zoltán személyi edző">
    <meta name="robots" content="noindex, nofollow">
    <title>Blog Admin Belépés - Nádasdi Zoltán</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div class="nav-brand">
                    <h1 class="logo">Nádasdi Zoltán</h1>
                    <p class="logo-subtitle">Személyi Edző</p>
                </div>
            </nav>
        </div>
    </header>

    <!-- Login Section -->
    <section class="section" style="min-height: 80vh; display: flex; align-items: center;">
        <div class="container">
            <div class="admin-login-wrapper">
                <div class="admin-login-card">
                    <div class="admin-login-header">
                        <span class="badge">ADMIN</span>
                        <h1 class="admin-login-title">Blog admin belépés</h1>
                        <p class="admin-login-subtitle">Itt tudsz belépni a cikkek kezeléséhez.</p>
                    </div>

                    <form id="loginForm" class="admin-login-form">
                        <div class="form-group">
                            <label for="email" class="form-label">E-mail cím</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-input" 
                                placeholder="admin@example.com"
                                required
                                autocomplete="email"
                            >
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">Jelszó</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input" 
                                placeholder="••••••••"
                                required
                                autocomplete="current-password"
                            >
                        </div>

                        <div id="errorMessage" class="error-message" style="display: none;"></div>

                        <button type="submit" class="btn btn-primary btn-large btn-full" id="loginButton">
                            Belépés
                        </button>
                    </form>

                    <div class="admin-login-footer">
                        <a href="../index.html" class="admin-back-link">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                            Vissza a főoldalra
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Nádasdi Zoltán. Minden jog fenntartva.</p>
            </div>
        </div>
    </footer>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Scripts -->
    <script src="../js/supabase.js"></script>
    <script src="../js/admin-auth.js"></script>
</body>
</html>
